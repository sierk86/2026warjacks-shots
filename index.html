<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warjacks Shot Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C8992A;
    --gold-light: #E8B840;
    --gold-bright: #FFD050;
    --black: #000000;
    --black-mid: #0e0e0e;
    --black-light: #1a1a1a;
    --black-card: #111111;
    --ice: #EAF4FF;
    --white: #FFFFFF;
    --red: #C0392B;
    --muted: #7A7A7A;
    --border: rgba(200,153,42,0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(200,153,42,0.07) 0%, transparent 55%),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 60px,
        rgba(255,255,255,0.012) 60px,
        rgba(255,255,255,0.012) 61px
      );
  }

  header {
    background: linear-gradient(180deg, #000 0%, #0e0e0e 100%);
    border-bottom: 3px solid var(--gold);
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% -10%, rgba(200,153,42,0.14) 0%, transparent 60%);
    pointer-events: none;
  }

  .header-inner {
    max-width: 780px;
    margin: 0 auto;
    padding: 16px 24px 14px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-wrap {
    flex-shrink: 0;
    filter: drop-shadow(0 4px 20px rgba(200,153,42,0.35));
  }

  .logo-wrap img {
    width: 110px;
    height: 110px;
    object-fit: contain;
    display: block;
  }

  .header-text { flex: 1; }

  .team-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    line-height: 0.9;
    letter-spacing: 2px;
    color: var(--white);
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }

  .team-name span { color: var(--gold-bright); }

  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 5px;
  }

  .rink-stripe {
    height: 5px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-bright) 50%, var(--gold) 100%);
  }

  .main {
    max-width: 780px;
    margin: 0 auto;
    padding: 22px 16px 48px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .card {
    background: var(--black-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--gold-bright), var(--gold));
  }

  .card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 2px;
    color: var(--gold-bright);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-title .puck {
    width: 20px; height: 20px;
    background: radial-gradient(circle at 35% 35%, #555, #111);
    border-radius: 50%;
    border: 2px solid #444;
    flex-shrink: 0;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
  }

  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }

  label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
  }

  input, select {
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--white);
    background: #000;
    border: 1.5px solid rgba(200,153,42,0.3);
    border-radius: 8px;
    padding: 11px 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    width: 100%;
  }

  input::placeholder { color: var(--muted); font-weight: 400; }

  input:focus, select:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(200,153,42,0.15);
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(70%) sepia(40%) saturate(400%) hue-rotate(10deg);
    cursor: pointer;
  }

  .shot-row { display: flex; align-items: center; gap: 10px; }

  .shot-btn {
    width: 42px; height: 42px;
    border-radius: 8px;
    border: 1.5px solid rgba(200,153,42,0.4);
    background: #000;
    color: var(--gold);
    font-size: 1.5rem;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    line-height: 1;
  }

  .shot-btn:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
    transform: scale(1.08);
  }

  .shot-input {
    flex: 1;
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 2px;
    color: var(--gold-bright);
    padding: 6px 14px;
  }

  .btn-submit {
    width: 100%;
    margin-top: 16px;
    padding: 15px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #000;
    border: none;
    border-radius: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(200,153,42,0.35);
    position: relative;
    overflow: hidden;
  }

  .btn-submit::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
    pointer-events: none;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(200,153,42,0.5);
  }

  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .score-total-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .score-total-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4.5rem;
    line-height: 1;
    color: var(--gold-bright);
    text-shadow: 0 0 30px rgba(255,208,80,0.4);
    letter-spacing: 3px;
    margin-bottom: 18px;
  }

  .goal-label-row {
    display: flex;
    justify-content: space-between;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .progress-track {
    width: 100%;
    height: 28px;
    background: #000;
    border-radius: 14px;
    border: 1px solid rgba(200,153,42,0.25);
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #C8992A, #FFD050, #fff8c0);
    border-radius: 14px;
    transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    position: relative;
  }

  .progress-glow {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, transparent 80%, rgba(255,220,80,0.6));
    border-radius: 14px;
    transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    pointer-events: none;
  }

  .progress-pct {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    text-align: right;
    margin-top: 8px;
    letter-spacing: 0.06em;
  }

  .lb-row {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 13px;
    background: #000;
    border-radius: 9px;
    border: 1px solid var(--border);
    margin-bottom: 8px;
    animation: fadeSlide 0.3s ease;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .lb-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: var(--muted);
    width: 26px;
    text-align: center;
    flex-shrink: 0;
  }

  .lb-rank.gold { color: var(--gold-bright); }
  .lb-rank.silver { color: #BDC3C7; }
  .lb-rank.bronze { color: #CD7F32; }

  .jersey {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    color: #000;
    background: var(--gold);
    flex-shrink: 0;
  }

  .lb-info { flex: 1; min-width: 0; }
  .lb-name { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-visits { font-size: 0.75rem; color: var(--muted); font-weight: 500; margin-top: 1px; }

  .lb-bar-wrap { width: 80px; }
  .lb-bar-track { height: 5px; background: rgba(200,153,42,0.15); border-radius: 3px; overflow: hidden; }
  .lb-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); border-radius: 3px; transition: width 0.6s ease; }

  .lb-shots {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--gold-bright);
    text-align: right;
    min-width: 50px;
    flex-shrink: 0;
  }

  .lb-shots small {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    color: var(--muted);
    display: block;
    text-align: right;
    margin-top: -4px;
    letter-spacing: 0.05em;
  }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  .chip {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1.5px solid rgba(200,153,42,0.3);
    background: transparent;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .chip.active, .chip:hover { background: var(--gold); border-color: var(--gold); color: #000; }

  .log-table { width: 100%; border-collapse: collapse; }

  .log-table th {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }

  .log-table td {
    padding: 10px 12px;
    font-size: 0.88rem;
    border-bottom: 1px solid rgba(200,153,42,0.07);
    vertical-align: middle;
  }

  .log-table tr:last-child td { border-bottom: none; }
  .log-table tr:hover td { background: rgba(200,153,42,0.04); }

  .td-shots {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    color: var(--gold-bright);
  }

  .del-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: #555;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.15s;
  }

  .del-btn:hover { background: rgba(192,57,43,0.2); color: var(--red); }
50%{opacity:0.4} }

  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--gold);
    color: #000;
    padding: 12px 28px;
    border-radius: 30px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(200,153,42,0.4);
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .records-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }

  .btn-clear {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1.5px solid rgba(192,57,43,0.4);
    background: transparent;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--red);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-clear:hover { background: var(--red); color: white; border-color: var(--red); }

  .sheet-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
    margin-left: auto;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: all 0.15s;
  }
  .sheet-link:hover { background: rgba(200,153,42,0.1); }

  @media(max-width:540px) {
    .form-grid { grid-template-columns: 1fr; }
    .scoreboard { grid-template-columns: repeat(2,1fr); }
    .team-name { font-size: 2rem; }
    .logo-wrap img { width: 80px; height: 80px; }
    .lb-bar-wrap { display: none; }
  }
  #playerDropdown div {
    padding: 10px 14px;
    font-family: 'Barlow', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--white);
    cursor: pointer;
    border-bottom: 1px solid rgba(200,153,42,0.1);
    transition: background 0.12s;
  }
  #playerDropdown div:last-child { border-bottom: none; }
  #playerDropdown div:hover { background: rgba(200,153,42,0.15); color: var(--gold-bright); }
  #playerDropdown div.add-new { color: var(--gold); font-style: italic; }
  #playerDropdown div.add-new:hover { background: rgba(200,153,42,0.2); }

</style>
</head>

          <button class="shot-btn" onclick="adj(-1)">−</button>
          <input type="number" id="shotCount" class="shot-input" value="1" min="1" max="50"/>
          <button class="shot-btn" onclick="adj(1)">+</button>
        </div>
      </div>

    </div>
    <button class="btn-submit" id="submitBtn" onclick="addRecord()">🏒 ADD TO WYH SHOT COUNT</button>
  </div>



  <div class="card" id="logCard" style="display:none">
    <div class="records-header">
      <div class="card-title" style="margin-bottom:0"><div class="puck"></div> SHOT LOG</div>
      <button class="btn-clear" onclick="clearAll()">Clear All</button>
    </div>
    <div class="filter-row" id="filterRow"></div>
    <table class="log-table">
      <thead><tr><th>Player</th><th>Date</th><th>Shots</th><th></th></tr></thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────
let records = JSON.parse(localStorage.getItem('warjackShots') || '[]');
let activeFilter = 'All';
let syncing = false;
let sheetTotal = 0;

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkncat6oT1VZx3_APSF6kSpXS2FR3kjaJ-rVBAV6fU9J8cO48Y3eMeP0hNho7fPSls/exec';

document.getElementById('visitDate').value = new Date().toISOString().split('T')[0];


// ── PLAYER DROPDOWN ───────────────────────────────────────────────────────
let allPlayers = [];
let dropdownVisible = false;

function getKnownPlayers() {
  // Merge local records + sheet players
  const local = [...new Set(records.map(r => r.name))];
  const combined = [...new Set([...allPlayers, ...local])].sort();
  return combined;
}

function showDropdown() {
  renderDropdown(document.getElementById('playerName').value);
  dropdownVisible = true;
}

function hideDropdown() {
  // Delay so click on option registers first
  setTimeout(() => {
    document.getElementById('playerDropdown').style.display = 'none';
    dropdownVisible = false;
  }, 180);
}

function filterDropdown() {
  renderDropdown(document.getElementById('playerName').value);
}

function renderDropdown(query) {
  const dd = document.getElementById('playerDropdown');
  const players = getKnownPlayers();
  const q = query.trim().toLowerCase();
  const filtered = q ? players.filter(p => p.toLowerCase().includes(q)) : players;

  let html = '';
  filtered.forEach(p => {
    html += `<div onmousedown="selectPlayer('${p.replace(/'/g, "\'")}')">${p}</div>`;
  });

  // Show "Add new" option if typed name doesn't exactly match
  const exactMatch = players.some(p => p.toLowerCase() === q);
  if (q && !exactMatch) {
    html += `<div class="add-new" onmousedown="selectPlayer('${query.trim().replace(/'/g, "\'")}')" >+ Add "${query.trim()}"</div>`;
  }

  if (html === '') {
    html = '<div style="color:var(--muted);cursor:default;">Type a name to add</div>';
  }

  dd.innerHTML = html;
  dd.style.display = 'block';
}

function selectPlayer(name) {
  document.getElementById('playerName').value = name;
  document.getElementById('playerDropdown').style.display = 'none';
}

// Populate allPlayers from sheet data on load
async function loadSheetPlayers() {
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?t=' + Date.now());
    const data = await res.json();
    if (data.rows) {
      allPlayers = [...new Set(data.rows.map(r => r.player).filter(Boolean))].sort();
    }
    if (typeof data.total === 'number') {
      sheetTotal = data.total;
      updateCounter(sheetTotal);
    }
  } catch(e) {
    const localTotal = records.reduce((s, r) => s + r.shots, 0);
    updateCounter(localTotal);
  }
}



function updateCounter(total) {
  const GOAL = 1500000;
  const pct = Math.min((total / GOAL) * 100, 100);
  document.getElementById('statTotal').textContent = total.toLocaleString();
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressGlow').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct.toFixed(4) + '% of 1,500,000 goal';
  document.getElementById('scoreCard').style.display = 'block';
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function save() { localStorage.setItem('warjackShots', JSON.stringify(records)); }

function adj(d) {
  const el = document.getElementById('shotCount');
  el.value = Math.max(1, Math.min(50, parseInt(el.value || 1) + d));
}

function fmtDate(s) {
  const [y,m,d] = s.split('-');
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+parseInt(d)+', '+y;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── ADD RECORD ────────────────────────────────────────────────────────────
async function addRecord() {
  const name  = document.getElementById('playerName').value.trim();
  const date  = document.getElementById('visitDate').value;
  const shots = parseInt(document.getElementById('shotCount').value);

  if (!name)  { toast('⚠️ Enter the player name'); return; }
  if (!date)  { toast('⚠️ Select a date'); return; }
  if (!shots) { toast('⚠️ At least 1 shot required'); return; }

  const record = { id: Date.now(), name, date, shots, synced: false };
  if (!allPlayers.includes(name)) { allPlayers.push(name); allPlayers.sort(); }
  records.unshift(record);
  save();

  // Optimistically update counter
  sheetTotal += shots;
  updateCounter(sheetTotal);
  renderLog();

  document.getElementById('playerName').value = '';
  document.getElementById('shotCount').value = 1;

  toast('🏒 ' + shots.toLocaleString() + ' shot' + (shots > 1 ? 's' : '') + ' added for ' + name + '!');
  await pushToSheet(record);
  // Reload from sheet to confirm accurate total
  await loadSheetTotal();
}

// ── PUSH ROW TO SHEET ─────────────────────────────────────────────────────
async function pushToSheet(record) {
  if (!APPS_SCRIPT_URL) return;
  if (syncing) return;
  syncing = true;
  try {
    const payload = {
      player:    record.name,
      date:      record.date,
      shots:     record.shots,
      timestamp: new Date().toLocaleString('en-US', {
        month:'short', day:'numeric', year:'numeric',
        hour:'numeric', minute:'2-digit', hour12:true
      })
    };
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    record.synced = true;
    save();
  } catch(e) {
    console.error('Sheet write error:', e);
  }
  syncing = false;
}

// ── DELETE / CLEAR ────────────────────────────────────────────────────────
function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  save();
  renderLog();
}

function clearAll() {
  if (!confirm('Delete all local records?')) return;
  records = [];
  save();
  activeFilter = 'All';
  renderLog();
}

// ── RENDER LOG ONLY ───────────────────────────────────────────────────────
function renderLog() {
  const has = records.length > 0;
  document.getElementById('logCard').style.display = has ? 'block' : 'none';
  if (!has) return;

  const players = [...new Set(records.map(r => r.name))];
  const allNames = ['All', ...players];
  document.getElementById('filterRow').innerHTML = allNames.map(n =>
    `<button class="chip ${activeFilter === n ? 'active' : ''}" onclick="setFilter('${n}')">${n}</button>`
  ).join('');

  const filtered = activeFilter === 'All' ? records : records.filter(r => r.name === activeFilter);
  document.getElementById('logBody').innerHTML = filtered.length === 0
    ? `<tr><td colspan="4"><div class="empty">NO RECORDS FOR ${activeFilter.toUpperCase()}</div></td></tr>`
    : filtered.map(r => `
      <tr>
        <td><strong>${r.name}</strong></td>
        <td>${fmtDate(r.date)}</td>
        <td class="td-shots">${r.shots.toLocaleString()}</td>
        <td>
          <span title="${r.synced ? 'Saved to sheet' : 'Local only'}" style="font-size:0.7rem;margin-right:4px;">${r.synced ? '🟢' : '🔴'}</span>
          <button class="del-btn" onclick="deleteRecord(${r.id})" title="Delete">✕</button>
        </td>
      </tr>`).join('');
}

function setFilter(n) { activeFilter = n; renderLog(); }

// ── INIT ──────────────────────────────────────────────────────────────────
loadSheetPlayers();
renderLog();
</script>
</body>
</html>
